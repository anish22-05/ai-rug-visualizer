# Local full stack:  docker compose up --build   ->  http://localhost:8080
services:
  api:
    build: ./backend
    environment:
      ALLOWED_ORIGINS: http://localhost:8080
      # Owner dashboard at http://localhost:8080/admin (change this value).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    ports:
      - "7860:7860"
    volumes:
      - catalog:/app/var   # owner-added rugs survive container rebuilds

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:7860
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  catalog:
